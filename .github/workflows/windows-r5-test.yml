# R5 1.3.0 Windows test: build from source, run Core/updater/address/device regression tests,
# rebuild the NSIS installer, silent-install it, launch the app for 30 s and
# capture 880 x 640 minimum layouts, installed icons, device types and R3 acceptance views.
# Results are committed back to test-results/<run-number>/ on main so they can
# be read without the Actions UI.
name: R5 1.3.0 Windows test

on:
  push:
    paths-ignore:
      - 'test-results/**'
  workflow_dispatch:
    inputs:
      hardware_runner:
        description: Use the dedicated interactive x64 Windows runner labelled usb-r5-hardware
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ${{ inputs.hardware_runner && 'usb-r5-hardware' || 'windows-latest' }}
    defaults:
      run:
        working-directory: r5-build/USB-Bridge-Desk-R5
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unzip source snapshot
        working-directory: .
        shell: powershell
        run: |
          $zip='source-fix38.zip'
          if(Test-Path r5-build){throw 'Clean runner checkout required: r5-build already exists'}
          Expand-Archive -LiteralPath $zip -DestinationPath r5-build
          Set-Location r5-build/USB-Bridge-Desk-R5
          if ((Get-FileHash packaging/icon.ico).Hash -ne
              ([BitConverter]::ToString([Security.Cryptography.SHA256]::Create().ComputeHash(
                [Convert]::FromBase64String((Get-Content packaging/icon.ico.b64 -Raw)))) -replace '-','')) { throw 'ICO source mismatch' }

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.404'

      - name: Install NSIS
        shell: powershell
        run: choco install nsis -y --no-progress

      - name: Full build pipeline (fetch vendor, build host, tests, publish, NSIS)
        id: build
        shell: pwsh
        timeout-minutes: 60
        env:
          MAKENSIS: 'C:\Program Files (x86)\NSIS\makensis.exe'
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $env:PYTHONUTF8 = "1"
          python -u dev/package.py 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { throw "package.py failed with $LASTEXITCODE" }
          if (Select-String -Path build.log -Pattern 'warning 6100|\(ACP\)' -Quiet) { throw 'makensis did not read setup.nsi as UTF-8; inspect build.log.' }
          if (-not (Select-String -Path build.log -Pattern 'Processing script file:.*\(UTF-?8\)' -Quiet)) { throw 'makensis log did not confirm UTF-8 source decoding.' }
          Get-ChildItem release/ | Format-Table Name, Length

      - name: Silent-install rebuilt installer
        id: install
        shell: powershell
        timeout-minutes: 30
        run: |
          $exe = Join-Path $PWD 'release\USB-Bridge-Desk-R5-1.3.0-x64.exe'
          $size = (Get-Item $exe).Length
          "SIZE=$size" | Out-File -Encoding utf8 install-result.txt
          "SHA256=$((Get-FileHash $exe -Algorithm SHA256).Hash)" | Add-Content install-result.txt
          $p = Start-Process -FilePath $exe -ArgumentList '/S' -Wait -PassThru
          "INSTALL_EXIT=$($p.ExitCode)" | Add-Content install-result.txt
          Get-Content install-result.txt
          if ($p.ExitCode -notin @(0, 3010)) { throw "Silent installation failed with $($p.ExitCode)" }
          $app = Join-Path $env:ProgramFiles 'USB Bridge Desk\UsbBridgeDesk.exe'
          if (-not (Test-Path -LiteralPath $app -PathType Leaf)) { throw "Installed application missing: $app" }
          "APP_PATH=$app" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Launch app, 30 s run, capture screenshots
        id: capture
        env:
          USB_BRIDGE_LOCAL_TYPE_FIXTURE: ${{ inputs.hardware_runner && '0' || '1' }}
        shell: powershell
        timeout-minutes: 20
        run: |
          if (-not (Test-Path $env:APP_PATH)) { throw "app not found: $($env:APP_PATH)" }
          $tmp=Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $tmp | Out-Null
          $portFile=Join-Path $tmp 'port.json'
          $profileDir=Join-Path $env:LOCALAPPDATA 'USB Bridge Desk'
          $profile=Join-Path $profileDir 'profiles.json'
          $prior=Test-Path $profile
          if($prior){Copy-Item -LiteralPath $profile -Destination "$tmp/prior.json"}
          $peer=$null
          try {
            $peer=Start-Process python -ArgumentList @('dev/capture-peer.py',('"'+$portFile+'"')) -PassThru -WindowStyle Hidden
            $end=(Get-Date).AddSeconds(8)
            while(!(Test-Path $portFile) -and (Get-Date) -lt $end){Start-Sleep -Milliseconds 100}
            $port=(Get-Content -Raw $portFile | ConvertFrom-Json).port
            New-Item -Force -ItemType Directory -Path $profileDir | Out-Null
            @{targets=@(@{id='capture';name='UI fixture (loopback)';mode='direct';host='127.0.0.1';port=$port})} |
              ConvertTo-Json -Depth 4 | Set-Content -Encoding UTF8 -LiteralPath $profile
            powershell -NoProfile -ExecutionPolicy Bypass -File dev/capture-auto.ps1 -AppPath $env:APP_PATH -OutDir screenshots
            $driver=$LASTEXITCODE
            "DRIVER_EXIT=$driver" | Out-File -Encoding utf8 driver-result.txt
            if ($driver -ne 0) { throw "capture-auto.ps1 failed with $driver" }
          } finally {
            if($peer -and !$peer.HasExited){$peer.Kill();$peer.WaitForExit()}
            if($prior){Copy-Item "$tmp/prior.json" $profile -Force}
            elseif(Test-Path $profile){Remove-Item -LiteralPath $profile}
          }

      - name: Check all four tray overlays using the installed icon
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        id: icons
        shell: pwsh
        run: |
          dotnet run --project dev/TrayCheck -c Release -- (Join-Path (Split-Path $env:APP_PATH) 'icon.ico') screenshots/tray-states
          exit $LASTEXITCODE

      - name: Exercise installed USB/IP backend on loopback
        id: backend
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: pwsh
        timeout-minutes: 5
        run: |
          python -u dev/test-backend.py backend.json
          exit $LASTEXITCODE

      - name: Exercise updater and GUI uninstall flows
        if: ${{ !cancelled() && steps.backend.outcome == 'success' }}
        shell: pwsh
        timeout-minutes: 20
        run: |
          $fixture=Join-Path $PWD 'screenshots'
          New-Item -ItemType Directory -Force $fixture | Out-Null
          $portFile=Join-Path $env:RUNNER_TEMP 'update-fixture-port.json'
          $server=Start-Process python -ArgumentList @('dev/update-fixture-server.py',("`"$fixture`""),("`"$portFile`"")) -PassThru -WindowStyle Hidden
          try {
            $deadline=(Get-Date).AddSeconds(15)
            while (!(Test-Path $portFile) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 100 }
            if (!(Test-Path $portFile)) { throw 'Updater fixture server did not start.' }
            $port=(Get-Content -Raw $portFile | ConvertFrom-Json).port
            $fixtureUrl="http://127.0.0.1:$port"
            $acceptancePath=Join-Path $PWD 'dev/windows-r5-acceptance.ps1'
            $parseTokens=$null
            $parseErrors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($acceptancePath,[ref]$parseTokens,[ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              $details=($parseErrors | ForEach-Object { "line $($_.Extent.StartLineNumber), column $($_.Extent.StartColumnNumber): $($_.Message)" }) -join '; '
              throw "Acceptance script parse failed: $details"
            }
            $env:ACCEPTANCE_PATH=$acceptancePath
            $powershell51=Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
            & $powershell51 -NoProfile -ExecutionPolicy Bypass -Command '$tokens=$null; $errors=$null; [void][System.Management.Automation.Language.Parser]::ParseFile($env:ACCEPTANCE_PATH,[ref]$tokens,[ref]$errors); if ($errors.Count -gt 0) { foreach ($errorItem in $errors) { [Console]::Error.WriteLine(("PowerShell 5.1 parse error at line {0}, column {1}: {2} | {3}" -f $errorItem.Extent.StartLineNumber,$errorItem.Extent.StartColumnNumber,$errorItem.Message,$errorItem.Extent.Text)) }; exit 1 }'
            if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 parser rejected acceptance.ps1.' }
            & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File dev/windows-r5-acceptance.ps1 `
              -AppPath $env:APP_PATH `
              -UninstallerPath (Join-Path (Split-Path $env:APP_PATH) 'Uninstall.exe') `
              -InstallerPath (Join-Path $PWD 'release\USB-Bridge-Desk-R5-1.3.0-x64.exe') `
              -FixtureUrl $fixtureUrl -OutDir $fixture
            if ($LASTEXITCODE -ne 0) { throw "Updater/uninstall acceptance failed with $LASTEXITCODE" }
          } finally {
            if ($server -and !$server.HasExited) { Stop-Process -Id $server.Id -Force }
          }

      - name: Collect install and startup diagnostics
        if: failure()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          Get-ChildItem -Path "$env:TEMP\usb-bridge-*.log" -File -ErrorAction SilentlyContinue | Copy-Item -Destination diagnostics
          $startup = Join-Path $env:LOCALAPPDATA 'USB Bridge Desk\startup.log'
          if (Test-Path $startup) { Copy-Item $startup diagnostics }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r5-test-${{ github.run_number }}
          path: |
            r5-build/USB-Bridge-Desk-R5/diagnostics/
            r5-build/USB-Bridge-Desk-R5/screenshots/
            r5-build/USB-Bridge-Desk-R5/build.log
            r5-build/USB-Bridge-Desk-R5/backend.json
            r5-build/USB-Bridge-Desk-R5/screenshots/update-available.png
            r5-build/USB-Bridge-Desk-R5/screenshots/settings-update-result.png
            r5-build/USB-Bridge-Desk-R5/screenshots/update-hash-failure.png
            r5-build/USB-Bridge-Desk-R5/screenshots/uninstall-running-app-guard.png
            r5-build/USB-Bridge-Desk-R5/screenshots/uninstall-confirmation.png
            r5-build/USB-Bridge-Desk-R5/screenshots/acceptance.log
            r5-build/USB-Bridge-Desk-R5/screenshots/requests.log
            r5-build/USB-Bridge-Desk-R5/screenshots/update-prompt-timeout.png
            r5-build/USB-Bridge-Desk-R5/install-result.txt
            r5-build/USB-Bridge-Desk-R5/driver-result.txt
            r5-build/USB-Bridge-Desk-R5/release/

      - name: Commit results back to repo
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        shell: powershell
        run: |
          $resultPath = "test-results/${{ github.run_number }}"
          $dest=Join-Path $env:GITHUB_WORKSPACE $resultPath
          New-Item -ItemType Directory -Force $dest | Out-Null
          if (Test-Path screenshots) { Copy-Item screenshots/* $dest/ -Recurse -Force }
          foreach ($f in @('build.log','install-result.txt','driver-result.txt','backend.json')) {
            if (Test-Path $f) { Copy-Item $f $dest/ -Force }
          }
          $cap = $null
          if (Test-Path screenshots/capture.json) { $cap = Get-Content screenshots/capture.json -Raw | ConvertFrom-Json }
          if (Test-Path diagnostics) { Copy-Item diagnostics $dest/ -Recurse -Force }
          $lines = @(
            "# R5 1.3.0 Windows test - run ${{ github.run_number }}",
            "",
            "- build: ${{ steps.build.outcome }}",
            "- silent install: ${{ steps.install.outcome }}",
            "- installed backend: ${{ steps.backend.outcome }}",
            "- tray overlays: ${{ steps.icons.outcome }}",
            "- desktop capture: ${{ steps.capture.outcome }}",
            "- installer: $(if (Test-Path install-result.txt) { (Get-Content install-result.txt -Raw).Trim() -replace "`r`n", ' | ' } else { 'n/a' })",
            "- driver exit: $(if (Test-Path driver-result.txt) { (Get-Content driver-result.txt -Raw).Trim() } else { 'n/a' })",
            "- alive 30s: $($cap.alive30s)",
            "- clean exit: $($cap.exitClean) (forced: $($cap.forcedExit), code: $($cap.exitCode))",
            "- screenshots: $(if ($cap) { $cap.screenshots.Count } else { 0 })",
            "- failures: $(if ($cap -and $cap.failures) { ($cap.failures -join '; ') } else { 'none recorded' })",
            ""
          )
          if (Test-Path backend.json) {
            $report=Get-Content -Raw backend.json | ConvertFrom-Json
            foreach ($check in $report.PSObject.Properties) {
              $result=$check.Value
              $detail=if ($result.passed) { ConvertTo-Json -InputObject $result.evidence -Compress } else { $result.error }
              $lines += "- $($check.Name) passed=$($result.passed) $detail"
            }
          }
          if ($cap.r4) {
            foreach ($entry in $cap.r4.minimum.PSObject.Properties) {
              $layout=$entry.Value
              $lines += "- minimum $($entry.Name): $($layout.width) x $($layout.height) DIP; within bounds=$($layout.withinWindow)"
            }
            $lines += "- address evidence: $($cap.r4.addresses -join ' / ')"
            $lines += "- acrylic: $($cap.acrylicEvidence.status) - $($cap.acrylicEvidence.reason)"
            $lines += "- local screenshot source: $($cap.r4.localSource) $($cap.r4.localFixture.name)"
            $lines += "- Windows local devices: $($cap.r4.localDevices -join ' / ')"
            $lines += "- remote device rows ($($cap.r4.remoteSource)): $($cap.r4.remoteDevices -join ' / ')"
          }
          if ($cap) { foreach ($s in $cap.screenshots) { $lines += "- $($s.file) ($($s.label)) sha256=$($s.sha256)" } }
          $lines | Set-Content -Encoding UTF8 (Join-Path $dest 'results.md')
          git config user.name 'moyu-test'
          git config user.email 'moyu-test@local'
          git -C "$env:GITHUB_WORKSPACE" add -- $resultPath
          if ($LASTEXITCODE -ne 0) { throw 'Could not stage run results' }
          git commit -m "R5 1.3.0 Windows test results (run ${{ github.run_number }})" --allow-empty
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit run results' }
          git status --porcelain | Tee-Object -FilePath (Join-Path $dest 'pre-rebase-status.txt')
          for ($attempt=1; $attempt -le 3; $attempt++) {
            git pull --rebase --autostash origin main
            if ($LASTEXITCODE -ne 0) { throw 'Could not rebase result commit on origin/main; see Git output' }
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw 'Could not publish results after three attempts' }
            Start-Sleep -Seconds $attempt
          }
